name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Added steps to set the short SHA as an output variable for use in the Docker image tap
    outputs:
      short-sha: ${{ steps.set_sha.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: set_sha
        run: echo "short_sha=${{ github.sha }} | cut -cl-7" >> $GITHUB_OUTPUT 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{  secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
        # Forcing a fresh commit to trigger Github Actions 
          context: .
          push: true
          # We use the GitHub SHA to create a unique tag for each build,
          # ensuring that we can trace back to the exact commit that produced the image.
          tags: ${{ secrets.DOCKER_USERNAME}}/python-app:${{ steps.set_sha.outputs.short_sha }}
